name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: soundlane-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: soundlane-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: soundlane-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/soundlane.exe" "${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/soundlane" "${{ matrix.artifact }}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
